<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Research Interests</title>
    <meta name="description" content="Research interests and Bachelor's thesis topics." />
    <meta name="robots" content="noindex, nofollow, noarchive, noimageindex" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/favicon-192x192.png" />
    <link rel="stylesheet" href="../style.css" />

    <!-- Set the theme before paint to avoid a flash of the wrong colors. -->
    <script>
      (function () {
        var el = document.documentElement;
        el.classList.add('js');
        try {
          var forced = new URLSearchParams(location.search).get('theme');
          var theme = forced || localStorage.getItem('theme');
          if (theme !== 'light' && theme !== 'dark') {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
          }
          el.setAttribute('data-theme', theme);
        } catch (e) {
          el.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>

  <body>
    <button id="theme-toggle" class="theme-toggle" type="button">Dark</button>

    <div class="wrap">
      <header>
        <h1 id="name"></h1>
        <p class="fullname" id="fullname"></p>
        <p class="affil">
          Lecturer, Computer Science Program<br />
          Faculty of Engineering, Vietnamese-German University
        </p>
        <ul class="links">
          <li><a href="../">← Back to homepage</a></li>
          <li><a id="email" href="#">Email</a></li>
          <li><a href="https://github.com/npbhoang">GitHub</a></li>
          <li><a href="https://www.linkedin.com/in/hoangnpb">LinkedIn</a></li>
        </ul>
      </header>

      <section id="research">
        <h2>Research Interests</h2>
        <!-- TODO: replace this placeholder with the research interests and
             Bachelor's thesis topics. -->
        <div class="construction">
          <p class="construction-icon" aria-hidden="true">🚧</p>
          <p class="lead">Under construction — check back soon.</p>
        </div>
      </section>

      <footer>
        <p><a href="../">← Back to homepage</a> · Last updated September 2026.</p>
      </footer>
    </div>

    <script>
      (function () {
        var btn = document.getElementById('theme-toggle');
        if (!btn) return;
        var root = document.documentElement;
        function sync() {
          var dark = root.getAttribute('data-theme') === 'dark';
          btn.textContent = dark ? '☀ Light' : '☾ Dark';
          btn.setAttribute(
            'aria-label',
            dark ? 'Switch to light mode' : 'Switch to dark mode'
          );
        }
        sync();
        btn.addEventListener('click', function () {
          var next =
            root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
          root.setAttribute('data-theme', next);
          try {
            localStorage.setItem('theme', next);
          } catch (e) {}
          sync();
        });
      })();
    </script>

    <!-- Identity is injected at runtime so it is not present in the static
         HTML source that simple scrapers / harvesters read. -->
    <script>
      (function () {
        function dec(b) {
          return new TextDecoder().decode(
            Uint8Array.from(atob(b), function (c) {
              return c.charCodeAt(0);
            })
          );
        }
        var name = dec('SG9hbmcgTmd1eWVu');
        var full = dec('Tmd1eeG7hW4gUGjGsOG7m2MgQuG6o28gSG/DoG5n');
        var user = dec('aG9hbmcubmd1eWVu');
        var domain = dec('aW5mLmV0aHouY2g=');

        document.title = name + ' — Research Interests';
        var n = document.getElementById('name');
        if (n) n.textContent = name;
        var f = document.getElementById('fullname');
        if (f) f.textContent = full;
        var mine = document.getElementsByClassName('me');
        for (var i = 0; i < mine.length; i++) mine[i].textContent = name;
        var em = document.getElementById('email');
        if (em) {
          var addr = user + '@' + domain;
          em.href = 'mail' + 'to:' + addr;
          em.textContent = addr;
        }
      })();
    </script>
  </body>
</html>
